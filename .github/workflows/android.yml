name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs supersede each other. Every other run gets a group of its own:
  # GitHub keeps only one pending run per group, so a shared group would let a
  # queued main run be evicted together with its commits, and the Telegram
  # announcement only ever lists the commits of the push that triggered it.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The Telegram message lists the pushed commits and the submodule
          # ships the pinned LSPlt AAR the native build links against.
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --console=plain

      # R8 and resource shrinking only run in release, so building it here keeps
      # the keep rules honest.
      - name: Assemble release
        run: ./gradlew :app:assembleRelease --console=plain

      # `build` used to run the full lint on every push; keep the check without
      # pulling in the redundant debug/release assembles it would redo.
      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      # The old single archive held `debug/` and `release/` as subdirectories.
      # Split it into one artifact per variant so a download is a plain APK
      # directory, and give release the R8 mapping that retraces its own
      # obfuscated stack traces.
      - name: Stage artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/dist/debug" "$RUNNER_TEMP/dist/release"
          cp -r app/build/outputs/apk/debug/. "$RUNNER_TEMP/dist/debug/"
          cp -r app/build/outputs/apk/release/. "$RUNNER_TEMP/dist/release/"
          cp app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/dist/release/"

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: ${{ runner.temp }}/dist/debug/
          if-no-files-found: error

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: ${{ runner.temp }}/dist/release/
          if-no-files-found: error

      - name: Post to Telegram channel
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          CHANNEL_ID: ${{ secrets.TELEGRAM_TO }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHANNEL_ID" ]; then
            echo "Telegram secrets are not set; skipping."
            exit 0
          fi
          apk=$(find app/build/outputs/apk/release -name 'WOMMO-*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "No release APK found."
            exit 1
          fi
          commit_count=$(jq -r '.commits | length' "$GITHUB_EVENT_PATH")
          { echo -e 'Github CI\n'; git log "-$commit_count" --pretty=format:"%h %s"; } > "$RUNNER_TEMP/git_log"
          # The caption lands inside the JSON `media` parameter, so it is
          # unescaped twice on the way: gawk folds a backslash pair in the
          # string literal and again in the replacement string, and JSON
          # parsing folds one more. Eight source backslashes therefore reach
          # MarkdownV2 as the single backslash it expects.
          escaped=$(gawk '{gsub(/[_*[\]()~`>#+=\|{}.!-]/,"\\\\\\\\&")}1' "$RUNNER_TEMP/git_log" \
            | sed -e 's|"|\\"|g' -e 's|^[0-9a-z]\+|__&__|' \
            | hexdump -v -e '/1 "%02X"' | sed 's/\(..\)/%\1/g')
          curl -sS --fail-with-body \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup?chat_id=${CHANNEL_ID}&media=%5B%7B%22type%22:%22document%22,%22media%22:%22attach://arm64_v8a%22,%22caption%22:%22${escaped}%22,%22parse_mode%22:%22MarkdownV2%22%7D%5D" \
            -F "arm64_v8a=@${apk}"
